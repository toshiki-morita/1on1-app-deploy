<!DOCTYPE html>
<html lang="ja" data-theme="light" data-density="cozy">
  <head>
    <base target="_top">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1on1ヒアリング支援アプリ - Hospitality UI</title>
    <style>
      /*
       * Hospitality UI デザイントークン（CSS変数）
       * - 色/余白/タイポグラフィを変数化してテーマ/密度の切替を容易にする
       */
      :root {
        /* color */
        --bg: #f7f9fc;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;      /* 青: 信頼・誠実 */
        --primary-600: #1d4ed8;
        --accent: #10b981;       /* 緑: 前進・安心 */
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #e5e7eb;
        --header-bg: #eef2ff;    /* ごく薄い藍色 */
        --row-hover: #f1f5f9;
        --zebra: #fafafa;
        --focus: rgba(37, 99, 235, .25);

        /* radii & shadows */
        --radius-sm: 6px;
        --radius-md: 10px;
        --shadow-sm: 0 2px 6px rgba(0,0,0,.06);
        --shadow-md: 0 6px 18px rgba(0,0,0,.10);

        /* typography base */
        --font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans JP, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";

        /* density: cozy (default) */
        --font-size: 15px;
        --line-height: 1.6;
        --space-1: 6px;
        --space-2: 10px;
        --space-3: 14px;
        --space-4: 18px;
        --cell-pad-y: 8px;
        --cell-pad-x: 12px;
        --input-h: 34px;
        --btn-h: 34px;
      }

      /* ダークテーマ */
      html[data-theme="dark"] {
        --bg: #0b1220;
        --surface: #121a2a;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #60a5fa;
        --primary-600: #3b82f6;
        --accent: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
        --border: #22304a;
        --header-bg: #0f172a;
        --row-hover: #0b1220;
        --zebra: #0d1627;
        --focus: rgba(96, 165, 250, .25);
        --shadow-sm: 0 2px 10px rgba(0,0,0,.35);
        --shadow-md: 0 12px 28px rgba(0,0,0,.45);
      }

      /* 密度: compact */
      html[data-density="compact"] {
        --font-size: 14px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --cell-pad-y: 6px;
        --cell-pad-x: 10px;
        --input-h: 30px;
        --btn-h: 30px;
      }

      /* 基本 */
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font-family);
        font-size: var(--font-size);
        line-height: var(--line-height);
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding-bottom: 22px; /* 下部同期スクロール用のクリアランス */
      }

      .container {
        width: 100%;
        max-width: none; /* 編集しやすいように幅制限を撤廃 */
        margin: 0 auto;
        padding: var(--space-4);
      }

      .app-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(180deg, var(--surface), rgba(255,255,255,0.6));
        backdrop-filter: saturate(1.2) blur(6px);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }
      .app-header-inner { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-1); }
      .brand { display:flex; align-items:center; gap:10px; }
      .brand-logo { width: 28px; height: 28px; border-radius: 6px; background: var(--primary); box-shadow: inset 0 0 0 3px var(--surface); }
      .brand-title { font-weight: 700; letter-spacing: .2px; }
      .brand-sub { color: var(--muted); font-size: 12px; }

      /* コントロール群 */
      .controls { display:flex; align-items:center; gap: var(--space-2); flex-wrap: wrap; }
      .select, .input, .btn {
        height: var(--btn-h);
        padding: 0 var(--space-2);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: var(--radius-sm);
        outline: none;
      }
      .select, .input { min-width: 220px; }
      .select:focus, .input:focus { box-shadow: 0 0 0 3px var(--focus); border-color: var(--primary); }

      .btn { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
      .btn:hover { border-color: var(--primary); }
      .btn:active { transform: translateY(0.5px); }
      .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary-600); }
      .btn-primary:hover { background: var(--primary-600); }
      .btn-ghost { background: transparent; }

      .toolbar { display:flex; align-items:center; justify-content: space-between; gap: var(--space-2); margin: var(--space-3) 0; }
      .status { color: var(--muted); font-size: 12px; }

      /* テーブルラッパー */
      .surface-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        padding: var(--space-2);
      }

      #table-scroller { overflow: auto; border-radius: var(--radius-sm); }
      /* 重複横スクロールバー抑止: ネイティブ横バーを非表示にし、固定ボトムバーのみを利用する */
      #table-scroller::-webkit-scrollbar:horizontal { height: 0px; }
      #table-scroller { scrollbar-width: thin; } /* Firefox: 縦は細く、横は下部バーに委譲 */
      /* すべてのブラウザで横バーを視覚的に隠すテクニック（下部固定バーへ委譲） */
      #table-scroller { padding-bottom: 18px; margin-bottom: -18px; }
      table.sheet-grid { border-collapse: separate; border-spacing: 0; min-width: 1200px; table-layout: fixed; width: 100%; }
      .sheet-grid th, .sheet-grid td { border: 1px solid var(--border); padding: var(--cell-pad-y) var(--cell-pad-x); background: var(--surface); vertical-align: top; }
      .sheet-grid thead th { position: sticky; top: 0; background: var(--header-bg); z-index: 3; box-shadow: 0 1px 0 var(--border), 0 2px 6px rgba(0,0,0,.04); }
      .sticky-col { position: sticky; left: 0; background: var(--surface); z-index: 2; box-shadow: 1px 0 0 var(--border); }
      .sheet-grid thead th.sticky-col { z-index: 4; }
      .sheet-grid tbody tr:nth-child(even) td { background: var(--zebra); }
      .sheet-grid tbody tr:hover td { background: var(--row-hover); }

      .caption { margin: var(--space-2) 0 var(--space-1); color: var(--muted); }

      /* フィルタ入力 */
      .filter-input { width: 100%; box-sizing: border-box; height: var(--input-h); padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
      .filter-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus); }

      /* セル入力/選択 */
      .cell-input { width: 100%; box-sizing: border-box; height: var(--input-h); padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
      .cell-select { width: 100%; box-sizing: border-box; height: var(--input-h); padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }

      /* ヘッダのソート表示 */
      .th-sort { cursor: pointer; user-select: none; position: relative; }
      .th-sort .arrow { margin-left: 6px; font-size: 11px; color: var(--muted); }
      .th-resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; }

      /* ローディング・エラー */
      .loading { color: var(--muted); }
      .error { color: var(--danger); }

      /* 下部同期スクロールバー */
      #bottom-scrollbar { position: fixed; left: 0; right: 0; bottom: 0; height: 16px; overflow-x: auto; overflow-y: hidden; background: var(--surface); border-top: 1px solid var(--border); z-index: 10; }
      #bottom-scrollbar .inner { height: 1px; }

      /* 多行エディタ */
      .ml-editor { position: fixed; z-index: 1000; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-md); padding: var(--space-2); border-radius: var(--radius-md); }
      .ml-editor .editor-textarea { width: 560px; max-width: 82vw; height: 230px; box-sizing: border-box; }
      .ml-editor .editor-actions { margin-top: var(--space-2); display: flex; gap: var(--space-2); justify-content: flex-end; align-items: center; }
      .ml-editor .hint { font-size: 12px; color: var(--muted); margin-right: auto; }
      .ml-editor-overlay { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.02); }

      /* 小バッジ */
      .badge { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); }

      /* アクセシビリティ: フォーカス可視化 */
      :is(button, a, input, select, textarea):focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); border-color: var(--primary); }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="container app-header-inner">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true"></span>
          <div>
            <div class="brand-title">1on1ヒアリング支援アプリ</div>
            <div class="brand-sub">Hospitality UI プレビュー</div>
          </div>
        </div>
        <div class="controls">
          <button id="toggle-theme" class="btn btn-ghost" title="ライト/ダーク切替">🌓 テーマ</button>
          <button id="toggle-density" class="btn btn-ghost" title="密度切替（cozy/compact）">↕ 余白</button>
          <a id="open-selected-sheet" href="#" target="_blank" rel="noopener" class="btn">スプレッドシートを開く</a>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- 1. 支店（シート）選択プルダウン -->
      <section class="surface-card">
        <div style="display:flex; align-items:center; gap: var(--space-2); flex-wrap: wrap;">
          <label for="sheet-select" class="badge">表示する支店</label>
          <select id="sheet-select" class="select">
            <option value="">読み込み中...</option>
          </select>
        </div>
      </section>

      <!-- ツールバー -->
      <div class="toolbar">
        <div id="status" class="status"></div>
        <div id="actions" class="controls"></div>
      </div>

      <!-- 2. テーブル表示領域 -->
      <section id="data-table-container" class="surface-card"></section>
    </main>

    <script>
      /**
       * 初期化：テーマ/密度トグルのセットアップと支店リンクの取得
       */
      document.addEventListener('DOMContentLoaded', () => {
        // トグル（テーマ）
        const themeBtn = document.getElementById('toggle-theme');
        themeBtn?.addEventListener('click', () => {
          const html = document.documentElement;
          const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          html.setAttribute('data-theme', next);
          // ローカル保存
          try { localStorage.setItem('ui:theme', next); } catch (_) {}
        });
        // トグル（密度）
        const densityBtn = document.getElementById('toggle-density');
        densityBtn?.addEventListener('click', () => {
          const html = document.documentElement;
          const next = html.getAttribute('data-density') === 'compact' ? 'cozy' : 'compact';
          html.setAttribute('data-density', next);
          try { localStorage.setItem('ui:density', next); } catch (_) {}
        });
        // 復元
        try {
          const t = localStorage.getItem('ui:theme');
          const d = localStorage.getItem('ui:density');
          if (t) document.documentElement.setAttribute('data-theme', t);
          if (d) document.documentElement.setAttribute('data-density', d);
        } catch (_) {}

        // List!A+B から作成したリンク一覧を取得
        google.script.run
          .withSuccessHandler(populateBranchSelector)
          .withFailureHandler(onFailure)
          .getBranchLinks();
      });

      /**
       * プルダウンを構築
       * @param {{label:string,url:string}[]|{error:string}} links
       */
      function populateBranchSelector(links) {
        if (links && links.error) { alert(links.error); return; }

        const selectElement = document.getElementById('sheet-select');
        selectElement.innerHTML = '';
        const openLink = document.getElementById('open-selected-sheet');

        const initialOption = document.createElement('option');
        initialOption.value = '';
        initialOption.textContent = '支店を選択してください';
        selectElement.appendChild(initialOption);

        (links || []).forEach(item => {
          const option = document.createElement('option');
          option.value = item.url;         // 値=リンクURL
          option.textContent = item.label; // 表示=会社名 支店名
          selectElement.appendChild(option);
        });

        // 初期は開くリンクを無効化
        if (openLink) { openLink.href = '#'; openLink.style.pointerEvents = 'none'; openLink.style.opacity = '0.5'; }

        selectElement.addEventListener('change', (event) => {
          const url = event.target.value;
          if (openLink) {
            if (url) { openLink.href = url; openLink.style.pointerEvents = 'auto'; openLink.style.opacity = '1'; }
            else { openLink.href = '#'; openLink.style.pointerEvents = 'none'; openLink.style.opacity = '0.5'; }
          }
          if (url) loadSheet(url);
        });
      }

      /**
       * URLからシート読込
       * @param {string} url
       */
      function loadSheet(url) {
        const container = document.getElementById('data-table-container');
        container.textContent = '';
        const status = document.getElementById('status');
        status.textContent = '読み込み中...';
        google.script.run
          .withSuccessHandler((data) => { status.textContent = ''; renderEditableGrid(url, data); })
          .withFailureHandler((err) => { status.textContent = ''; onFailure(err); })
          .getSheetDataWithSchemaFromUrl(url);
      }

      /**
       * 編集可能グリッドの描画
       * @param {string} url
       * @param {{sheetName:string,headers:string[],rows:string[][],dropdownByCol?:Object,dateIsoByCol?:Object,sheetUrl?:string,linksByCol?:Object,checkboxByCol?:Object,checkboxStateByCol?:Object}|{error:string}} data
       */
      function renderEditableGrid(url, data) {
        const container = document.getElementById('data-table-container');
        if (data && data.error) { container.textContent = data.error; return; }

        const { sheetName, headers, rows, dropdownByCol = {}, dateIsoByCol = {}, sheetUrl, linksByCol = {}, checkboxByCol = {}, checkboxStateByCol = {} } = data || {};
        if (!headers || headers.length === 0) {
          container.textContent = 'データがありません。';
          return;
        }

        /**
         * 状態管理
         * @typedef State
         * @property {string} currentUrl
         * @property {string} sheetName
         * @property {string[]} headers
         * @property {string[][]} rows
         * @property {Object} dropdownByCol
         * @property {Object} dateIsoByCol
         * @property {{[col:number]:string[]}} linksByCol
         * @property {{[col:number]:boolean}} checkboxByCol
         * @property {{[col:number]:{[row:number]:boolean}}} checkboxStateByCol
         * @property {{col:number|null, dir:'asc'|'desc'|null}} sort
         * @property {{[col:number]:string}} filters
         * @property {number[]} viewRowIndices
         * @property {number|null} frozenColIndex
         */
        /** @type {State} */
        const state = {
          currentUrl: sheetUrl || url,
          sheetName: sheetName || '',
          headers: headers.slice(),
          rows: (rows || []).map(r => r.slice()),
          dropdownByCol,
          dateIsoByCol,
          linksByCol,
          checkboxByCol,
          checkboxStateByCol,
          sort: { col: null, dir: null },
          filters: {},
          viewRowIndices: [],
          frozenColIndex: findFrozenColIndex(headers)
        };

        // 初期ビュー計算
        recomputeView();

        // キャプション
        container.innerHTML = '';
        const caption = document.createElement('div');
        caption.className = 'caption';
        const openHref = sheetUrl || url;
        const labelNode = document.createTextNode('シート: ');
        const aNode = document.createElement('a');
        aNode.href = openHref; aNode.target = '_blank'; aNode.rel = 'noopener'; aNode.textContent = sheetName;
        caption.appendChild(labelNode); caption.appendChild(aNode);
        container.appendChild(caption);

        // アクション（タブ切替）
        const actionsDiv = document.getElementById('actions');
        if (actionsDiv) {
          actionsDiv.innerHTML = '';
          const btnFront = document.createElement('button'); btnFront.className = 'btn';
          btnFront.textContent = 'フロント担当者を開く'; btnFront.addEventListener('click', () => openTab('フロント担当者'));
          actionsDiv.appendChild(btnFront);
          const btnMain = document.createElement('button'); btnMain.className = 'btn btn-primary';
          btnMain.textContent = '1on1を開く'; btnMain.addEventListener('click', () => openTab('1on1'));
          actionsDiv.appendChild(btnMain);
          const btnResetWidth = document.createElement('button'); btnResetWidth.className = 'btn';
          btnResetWidth.textContent = '列幅リセット'; btnResetWidth.addEventListener('click', () => resetColumnWidths());
          actionsDiv.appendChild(btnResetWidth);
        }

        // スクロールコンテナ
        const scroller = document.createElement('div');
        scroller.id = 'table-scroller';
        container.appendChild(scroller);

        // 画面下部の同期スクロールバー
        let bottomBar = document.getElementById('bottom-scrollbar');
        if (!bottomBar) {
          bottomBar = document.createElement('div');
          bottomBar.id = 'bottom-scrollbar';
          const inner = document.createElement('div'); inner.className = 'inner';
          bottomBar.appendChild(inner); document.body.appendChild(bottomBar);
        }
        const bottomInner = bottomBar.querySelector('.inner');
        let syncingScroll = false;
        scroller.addEventListener('scroll', () => { if (syncingScroll) return; syncingScroll = true; bottomBar.scrollLeft = scroller.scrollLeft; syncingScroll = false; }, { passive: true });
        bottomBar.addEventListener('scroll', () => { if (syncingScroll) return; syncingScroll = true; scroller.scrollLeft = bottomBar.scrollLeft; syncingScroll = false; }, { passive: true });

        // ===== ヘルパー関数群（この関数内で使用） =====
        /**
         * 固定列の判定：ヘッダに『マンション名』があればその列を固定
         * @param {string[]} headers
         * @returns {number|null}
         */
        function findFrozenColIndex(headers) {
          const idx = (headers || []).findIndex(h => (h || '').trim() === 'マンション名');
          return idx >= 0 ? idx : null;
        }

        /**
         * 列のデフォルト幅(px)をヘッダ名から簡易推定
         * @param {number} colIdx
         * @returns {number}
         */
        function computeDefaultColWidthPx(colIdx) {
          const name = (state.headers[colIdx] || '').trim();
          if (name === 'マンション名') return 240;
          if (name === '住所') return 320;
          if (/備考|メモ|内容|履歴|コメント|詳細|所見|連絡|補足/.test(name)) return 260;
          return 160;
        }

        /**
         * テーブルの総幅をcolgroupから算出し設定。下部スクロール幅も更新
         */
        function updateTableWidth() {
          // colgroupは直下にある前提
          const colgroupEl = table.querySelector('colgroup');
          let sum = 0;
          if (colgroupEl) {
            colgroupEl.querySelectorAll('col').forEach(col => {
              const w = parseInt(String(col.style.width || '0').replace('px','')) || 0;
              sum += w;
            });
          }
          // 最低幅はmin-widthに依存
          const min = 1200;
          table.style.width = Math.max(sum, min) + 'px';
          updateBottomScrollerWidth();
        }

        /**
         * 下部スクロールバーの内側幅をテーブルに合わせて更新
         */
        function updateBottomScrollerWidth() {
          try {
            const sw = table.scrollWidth || table.getBoundingClientRect().width;
            bottomInner.style.width = Math.ceil(sw) + 'px';
          } catch (_) {}
        }

        /**
         * 列リサイズ開始。対象列だけ横に広げ、他列は縮めない（横スクロールで対応）
         * @param {MouseEvent} ev
         * @param {HTMLTableCellElement} th
         * @param {number} colIdx
         */
        function initResize(ev, th, colIdx) {
          ev.preventDefault();
          const colgroupEl = table.querySelector('colgroup');
          const colEl = colgroupEl?.querySelector(`col[data-col="${colIdx}"]`);
          if (!colEl) return;
          const startX = ev.clientX;
          const startW = parseInt(String(colEl.style.width || '0').replace('px','')) || 0;

          function onMove(e) {
            const dx = e.clientX - startX;
            const next = Math.max(60, startW + dx);
            colEl.style.width = next + 'px';
            saveWidth(colIdx, next);
            updateTableWidth();
          }
          function onUp() {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          }
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        }

        /**
         * チェックボックスのフォールバック値判定（『済』/空やTRUE/FALSEに対応）
         * @param {string} v
         * @returns {boolean}
         */
        function parseFallbackCheckbox(v) {
          const s = String(v || '').trim();
          if (!s) return false;
          if (s === '済') return true;
          return s.toLowerCase() === 'true';
        }

        /**
         * セル保存（即時UI反映＋GAS保存）。失敗時はロールバック
         * @param {object} state
         * @param {number} rowIndex
         * @param {number} colIndex
         * @param {any} value
         */
        function applyCellEdit(state, rowIndex, colIndex, value) {
          const status = document.getElementById('status');
          const prev = state.rows[rowIndex][colIndex];
          state.rows[rowIndex][colIndex] = value;
          if (status) status.textContent = '保存中...';
          google.script.run
            .withSuccessHandler(() => {
              if (status) { status.textContent = '保存しました'; setTimeout(() => { if (status.textContent === '保存しました') status.textContent = ''; }, 800); }
            })
            .withFailureHandler((err) => {
              console.error('applyEdits失敗', err);
              state.rows[rowIndex][colIndex] = prev; // ロールバック
              if (status) status.textContent = '保存に失敗しました';
              alert('保存に失敗しました。ネットワークや権限をご確認ください。');
            })
            .applyEdits(state.currentUrl, [{ rowIndex, colIndex, value }]);
        }

        /**
         * タブ切替（フロント担当者/1on1）
         * @param {string} tabName
         */
        function openTab(tabName) {
          const status = document.getElementById('status');
          if (status) status.textContent = `${tabName} を読み込み中...`;
          google.script.run
            .withSuccessHandler((d) => { if (status) status.textContent = ''; renderEditableGrid(state.currentUrl, d); })
            .withFailureHandler((err) => { if (status) status.textContent = ''; onFailure(err); })
            .getTabDataWithSchemaFromUrl(state.currentUrl, tabName);
        }

        // 画面リサイズ時も下部バー幅を追随
        window.addEventListener('resize', updateBottomScrollerWidth, { passive: true });

        // 列幅永続化
        const widthStorageKey = `colWidths:${state.currentUrl}`;
        function loadSavedWidths() { try { const s = localStorage.getItem(widthStorageKey); return s ? JSON.parse(s) : {}; } catch (_) { return {}; } }
        function saveWidth(colIdx, px) { try { const map = loadSavedWidths(); map[String(colIdx)] = Math.max(60, Math.floor(px)); localStorage.setItem(widthStorageKey, JSON.stringify(map)); } catch (_) {} }
        function resetColumnWidths() {
          try { localStorage.removeItem(widthStorageKey); } catch (_) {}
          const status = document.getElementById('status'); status.textContent = '列幅を初期化して再読込中...';
          google.script.run
            .withSuccessHandler((d) => { status.textContent = ''; renderEditableGrid(state.currentUrl, d); })
            .withFailureHandler((err) => { status.textContent = ''; onFailure(err); })
            .getSheetDataWithSchemaFromUrl(state.currentUrl);
        }

        // テーブル構築
        const table = document.createElement('table'); table.className = 'sheet-grid';
        scroller.appendChild(table);

        const thead = document.createElement('thead');
        const trHead = document.createElement('tr');
        const allCols = headers.map((_, i) => i);
        const colOrder = (state.frozenColIndex != null) ? [state.frozenColIndex, ...allCols.filter(i => i !== state.frozenColIndex)] : allCols.slice();
        const HIDDEN_HEADER_NAMES = new Set(['ID']);
        const hiddenColSet = new Set(headers.map((h, i) => ((h || '').trim())).map((name, i) => ({name, i}))
          .filter(obj => HIDDEN_HEADER_NAMES.has(obj.name)).map(obj => obj.i));
        const visibleColOrder = colOrder.filter(i => !hiddenColSet.has(i));

        const colgroup = document.createElement('colgroup');
        const savedWidths = loadSavedWidths();
        visibleColOrder.forEach((origColIdx) => {
          const col = document.createElement('col'); col.dataset.col = String(origColIdx);
          const saved = savedWidths && Object.prototype.hasOwnProperty.call(savedWidths, String(origColIdx)) ? Number(savedWidths[String(origColIdx)]) : null;
          const w = isFinite(saved) && saved > 0 ? saved : computeDefaultColWidthPx(origColIdx);
          col.style.width = w + 'px'; colgroup.appendChild(col);
        });
        table.appendChild(colgroup);
        updateTableWidth();

        visibleColOrder.forEach((origColIdx) => {
          const th = document.createElement('th'); th.className = 'th-sort'; th.dataset.col = String(origColIdx);
          if (state.frozenColIndex === origColIdx) th.classList.add('sticky-col');
          const title = document.createElement('span'); title.textContent = headers[origColIdx] || '';
          const arrow = document.createElement('span'); arrow.className = 'arrow';
          th.appendChild(title); th.appendChild(arrow);
          th.addEventListener('click', () => toggleSort(origColIdx));
          const resizer = document.createElement('span'); resizer.className = 'th-resizer'; resizer.addEventListener('mousedown', (e) => initResize(e, th, origColIdx)); th.appendChild(resizer);
          trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        // フィルター行
        const trFilter = document.createElement('tr');
        visibleColOrder.forEach((origColIdx) => {
          const th = document.createElement('th'); if (state.frozenColIndex === origColIdx) th.classList.add('sticky-col');
          const input = document.createElement('input'); input.type = 'text'; input.placeholder = 'フィルター'; input.className = 'filter-input';
          input.addEventListener('input', () => { state.filters[origColIdx] = input.value || ''; recomputeView(); renderBody(); });
          th.appendChild(input); trFilter.appendChild(th);
        });
        thead.appendChild(trFilter); table.appendChild(thead);

        const tbody = document.createElement('tbody'); table.appendChild(tbody);

        updateSortArrows();
        renderBody();

        // ===== 関数群 =====
        function recomputeView() {
          const total = state.rows.length; let idx = [...Array(total).keys()];
          idx = idx.filter(r => {
            for (const [cStr, v] of Object.entries(state.filters)) {
              const c = Number(cStr);
              if (v && !String(state.rows[r][c] || '').toLowerCase().includes(String(v).toLowerCase())) return false;
            }
            return true;
          });
          if (state.sort.col != null && state.sort.dir) {
            const c = state.sort.col; const dir = state.sort.dir === 'asc' ? 1 : -1;
            idx.sort((a, b) => String(state.rows[a][c] || '').localeCompare(String(state.rows[b][c] || '')) * dir);
          }
          state.viewRowIndices = idx;
        }

        function updateSortArrows() {
          const ths = trHead.querySelectorAll('th');
          ths.forEach((th) => {
            const arrow = th.querySelector('.arrow'); if (!arrow) return;
            const orig = Number(th.dataset.col || -1);
            if (state.sort.col === orig) { arrow.textContent = state.sort.dir === 'asc' ? '▲' : '▼'; }
            else { arrow.textContent = ''; }
          });
        }

        function toggleSort(colIdx) {
          if (state.sort.col === colIdx) {
            state.sort.dir = state.sort.dir === 'asc' ? 'desc' : (state.sort.dir === 'desc' ? null : 'asc');
            if (state.sort.dir === null) state.sort.col = null;
          } else {
            state.sort.col = colIdx; state.sort.dir = 'asc';
          }
          updateSortArrows(); renderBody();
        }

        function renderBody() {
          tbody.textContent = '';
          // 可視列順
          const allCols = state.headers.map((_, i) => i);
          const colOrder = (state.frozenColIndex != null) ? [state.frozenColIndex, ...allCols.filter(i => i !== state.frozenColIndex)] : allCols.slice();
          const HIDDEN_HEADER_NAMES = new Set(['ID']);
          const hiddenColSet = new Set(state.headers.map((h, i) => ((h || '').trim())).map((name, i) => ({name, i}))
            .filter(obj => HIDDEN_HEADER_NAMES.has(obj.name)).map(obj => obj.i));
          const visibleColOrder = colOrder.filter(i => !hiddenColSet.has(i));

          for (const r of state.viewRowIndices) {
            const tr = document.createElement('tr');
            visibleColOrder.forEach((origColIdx) => {
              const td = document.createElement('td'); if (state.frozenColIndex === origColIdx) td.classList.add('sticky-col');
              const headerName = (state.headers[origColIdx] || '').trim();
              const linksArr = state.linksByCol[origColIdx] || null;
              const checkboxCol = !!state.checkboxByCol[String(origColIdx)];
              const checkboxStateMap = state.checkboxStateByCol[String(origColIdx)] || {};
              const isDateCol = !!state.dateIsoByCol[String(origColIdx)];

              // 疑似チェックボックス（フォールバック対応含む）
              if (checkboxCol || headerName === '面談済み' || headerName === '面談済') {
                const key = String(r);
                const initial = checkboxCol ? !!checkboxStateMap[key] : parseFallbackCheckbox(state.rows[r][origColIdx]);
                const input = document.createElement('input'); input.type = 'checkbox'; input.checked = initial; input.title = 'クリックで保存';
                input.addEventListener('change', () => {
                  const newVal = input.checked;
                  // 本物のチェックボックス列はboolean、フォールバックは『済/空』
                  const valToSave = checkboxCol ? newVal : (newVal ? '済' : '');
                  applyCellEdit(state, r, origColIdx, valToSave);
                });
                td.appendChild(input);
              }
              // 日付列
              else if (isDateCol) {
                const input = document.createElement('input'); input.type = 'date'; input.className = 'cell-input';
                const iso = (state.rows[r][origColIdx] || '').slice(0,10); if (iso) input.value = iso;
                input.addEventListener('change', () => applyCellEdit(state, r, origColIdx, input.value));
                td.appendChild(input);
              }
              // プルダウン列
              else if (state.dropdownByCol && state.dropdownByCol[String(origColIdx)]) {
                const select = document.createElement('select'); select.className = 'cell-select';
                const opts = state.dropdownByCol[String(origColIdx)] || [];
                const cur = state.rows[r][origColIdx] || '';
                // 空オプション
                const emptyOpt = document.createElement('option'); emptyOpt.value = ''; emptyOpt.textContent = ''; select.appendChild(emptyOpt);
                opts.forEach(o => { const op = document.createElement('option'); op.value = o; op.textContent = o; if (o === cur) op.selected = true; select.appendChild(op); });
                select.addEventListener('change', () => applyCellEdit(state, r, origColIdx, select.value));
                td.appendChild(select);
              }
              // リンク表示（マンション名など）。多行エディタより優先してリンクを描画する
              else if (Array.isArray(linksArr) && linksArr[r]) {
                // バックエンド仕様：linksByCol[colIndex] は各行のURL文字列配列
                const urlStr = String(linksArr[r] || '');
                const a = document.createElement('a');
                a.href = urlStr;
                a.textContent = state.rows[r][origColIdx] || urlStr; // 表示テキストはセル表示値
                a.target = '_blank'; a.rel = 'noopener';
                td.appendChild(a);
              }
              // 読み取り専用列（旧index互換）：住所列、1on1タブの面談状況
              else if (headerName === '住所' || (state.sheetName === '1on1' && headerName === '面談状況')) {
                const text = state.rows[r][origColIdx] || '';
                const span = document.createElement('span'); span.textContent = text; span.title = text;
                span.style.whiteSpace = 'nowrap'; span.style.overflow = 'hidden'; span.style.textOverflow = 'ellipsis'; span.style.display = 'block'; span.style.minHeight = '22px';
                td.appendChild(span);
              }
              // 多行テキスト（ダブルクリックでエディタ）
              else if (shouldUseMultilineEditor(headerName, state.rows[r][origColIdx])) {
                const text = state.rows[r][origColIdx] || '';
                const span = document.createElement('span'); span.textContent = text; span.title = text;
                // ベース表示は1行（省略記号）で、ダブルクリック時のみ多行エディタを開く
                span.style.whiteSpace = 'nowrap';
                span.style.overflow = 'hidden';
                span.style.textOverflow = 'ellipsis';
                span.style.display = 'block';
                span.style.minHeight = '22px';
                span.addEventListener('dblclick', () => openMultilineEditor(state, r, origColIdx, span));
                td.appendChild(span);
              }
              // 通常の単行入力
              else {
                const input = document.createElement('input'); input.type = 'text'; input.className = 'cell-input';
                input.value = state.rows[r][origColIdx] || '';
                input.addEventListener('change', () => applyCellEdit(state, r, origColIdx, input.value));
                td.appendChild(input);
              }

              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          }
        }

        /**
         * 多行エディタを使用すべきかの判定 [IV][RP]
         * - ヘッダ名に「メモ/備考/ヒアリング/内容/履歴/コメント/詳細/所見/連絡/補足」を含む場合
         * - またはセル値が改行を含む/一定以上の長さ（> 20 文字）の場合
         * @param {string} headerName 列ヘッダ名
         * @param {string} cellValue セルの現在値
         * @returns {boolean} 多行エディタ対象か
         */
        function shouldUseMultilineEditor(headerName, cellValue) {
          const h = String(headerName || '').trim();
          const patterns = ['メモ', '備考', 'ヒアリング', '内容', '履歴', 'コメント', '詳細', '所見', '連絡', '補足'];
          const headerMatch = patterns.some(p => h.includes(p));
          const v = String(cellValue || '');
          const valueLooksMultiline = v.includes('\n') || v.length > 20;
          return headerMatch || valueLooksMultiline;
        }


        // 多行エディタ
        /**
         * 多行エディタをモーダルで開く [UX]
         * 保存時は state を更新し、必要に応じて単行表示の要素も即時反映する。
         * @param {object} state 内部状態
         * @param {number} rowIdx 行インデックス
         * @param {number} colIdx 列インデックス
         * @param {HTMLElement=} spanEl 保存後に更新する対象のスパン（任意）
         */
        function openMultilineEditor(state, rowIdx, colIdx, spanEl) {
          const prev = state.rows[rowIdx][colIdx] || '';

          const overlay = document.createElement('div'); overlay.className = 'ml-editor-overlay'; document.body.appendChild(overlay);

          const editor = document.createElement('div'); editor.className = 'ml-editor'; document.body.appendChild(editor);
          const textarea = document.createElement('textarea'); textarea.className = 'editor-textarea'; textarea.value = prev; editor.appendChild(textarea);

          const actions = document.createElement('div'); actions.className = 'editor-actions'; editor.appendChild(actions);
          const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = 'Escで閉じる / Ctrl+Enterで保存'; actions.appendChild(hint);

          const cancelBtn = document.createElement('button'); cancelBtn.className = 'btn'; cancelBtn.textContent = 'キャンセル'; actions.appendChild(cancelBtn);
          const saveBtn = document.createElement('button'); saveBtn.className = 'btn btn-primary'; saveBtn.textContent = '保存'; actions.appendChild(saveBtn);

          function close() { document.body.removeChild(editor); document.body.removeChild(overlay); }
          function save() {
            const v = textarea.value;
            applyCellEdit(state, rowIdx, colIdx, v);
            // 単行表示に即時反映（次回ダブルクリック時は state から取得される）
            if (spanEl) { spanEl.textContent = v; spanEl.title = v; }
            close();
          }

          cancelBtn.addEventListener('click', close);
          saveBtn.addEventListener('click', save);
          overlay.addEventListener('click', close);
          window.addEventListener('keydown', (ev) => {
            if (ev.key === 'Escape') close();
            if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'enter') save();
          }, { once: true });

          // 配置（中央）
          const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
          const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
          const rect = { w: 600, h: 300 };
          editor.style.left = Math.max(16, (vw - rect.w) / 2) + 'px';
          editor.style.top = Math.max(24, (vh - rect.h) / 2) + 'px';
        }
      }

      /**
       * 失敗ハンドラ
       * @param {Error} error
       */
      function onFailure(error) {
        console.error('[GAS Error]', error);
        const status = document.getElementById('status');
        if (status) status.textContent = 'エラーが発生しました。時間をおいて再試行してください。';
        alert('通信でエラーが発生しました。詳細はコンソールをご確認ください。');
      }
    </script>
  </body>
</html>
